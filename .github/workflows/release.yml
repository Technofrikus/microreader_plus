# Release — triggered by pushing a tag matching 'v*' (e.g. v2.0.42).
#
# Builds the ESP32 firmware binary and the Calibre plugin zip, then creates a
# GitHub Release with clearly named versioned files attached. Release notes are auto-generated
# from the git log since the last tag.
#
# How to create a release:
#   1. git tag v2.0.42
#   2. git push origin v2.0.42
#   3. The workflow below does the rest.
#
# The version string shown in the firmware (MICROREADER_VERSION) comes from
# version.txt + git commit count, generated by tools/generate_version.py.
# Bump version.txt before tagging if you want a new base version.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  esp32:
    name: Build ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git commit count in version.h

      - name: Install PlatformIO
        run: pip install platformio

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        run: pio run

      - name: Rename firmware with version
        run: mv firmware.bin "Microreader-TF-${{ steps.version.outputs.version }}.bin"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: "Microreader-TF-${{ steps.version.outputs.version }}.bin"

  calibre-plugin:
    name: Build Calibre plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        run: python tools/calibre-plugin/build.py

      - name: Rename plugin with version
        run: mv tools/calibre-plugin/microreader.zip "Microreader-Calibre-Plugin-${{ steps.version.outputs.version }}.zip"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibre-plugin
          path: "Microreader-Calibre-Plugin-${{ steps.version.outputs.version }}.zip"

  release:
    name: Create GitHub Release
    needs: [esp32, calibre-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download into one known directory. This avoids relying on the default
      # artifact-name directory layout when passing files to action-gh-release.
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: release-assets

      - name: Download Calibre plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: calibre-plugin
          path: release-assets

      - name: Verify release assets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          test -f "release-assets/Microreader-TF-${VERSION}.bin"
          test -f "release-assets/Microreader-Calibre-Plugin-${VERSION}.zip"
          ls -l release-assets

      - name: Generate release notes
        id: notes
        run: |
          # Extract version from tag (strip leading 'v')
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Build a simple changelog from commits since the last tag
          PREV_TAG=$(git tag --sort=-v:refname | head -n 2 | tail -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" "$PREV_TAG..HEAD" --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s" --no-merges | head -n 30)
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Microreader+ (TF Edition) - ${{ steps.notes.outputs.version }}
          body: |
            ## Microreader ${{ steps.notes.outputs.version }}

            ### What's new
            ${{ steps.notes.outputs.changelog }}

            ### Downloads
            - **Microreader-TF-${{ steps.notes.outputs.version }}.bin** — Flash this to your Xteink X4 (ESP32-C3).
              Use the Crosspoint web flasher or esptool:
              `python -m esptool --chip esp32c3 --port COM5 --baud 921600 write_flash 0x0 "Microreader-TF-${{ steps.notes.outputs.version }}.bin"`
            - **Microreader-Calibre-Plugin-${{ steps.notes.outputs.version }}.zip** — Calibre plugin for sending/receiving books.
              Install in Calibre: Preferences → Plugins → Load plugin from file.
          files: |
            release-assets/Microreader-TF-${{ steps.notes.outputs.version }}.bin
            release-assets/Microreader-Calibre-Plugin-${{ steps.notes.outputs.version }}.zip
          draft: false
          prerelease: false
          generate_release_notes: false
