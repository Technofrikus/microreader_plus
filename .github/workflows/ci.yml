# CI — runs on every push and pull request to main.
#
# Verifies the ESP32 release firmware compiles and the Calibre plugin builds.
# Desktop builds and tests are not included here — they run locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  esp32:
    name: Build ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for tags + git commit count in version.h

      - name: Install PlatformIO
        run: pip install platformio

      # Release configuration (no debug overlay / diagnostic log), same as release.yml.
      - name: Build firmware
        run: pio run -e esp32c3-release

      # Read the version the firmware was actually built with (the string shown
      # in the Settings screen), generated by tools/generate_version.py.
      - name: Extract version
        id: version
        run: |
          version=$(sed -n 's/^#define MICROREADER_VERSION "\(.*\)"/\1/p' lib/microreader/version.h)
          test -n "$version" || { echo "MICROREADER_VERSION not found in version.h"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.version }}
          path: firmware.bin

  calibre-plugin:
    name: Build Calibre plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: python tools/calibre-plugin/build.py

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibre-plugin
          path: tools/calibre-plugin/microreader.zip
